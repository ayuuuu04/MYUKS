<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MY UKS — Markas Digital PMR</title>
  

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  

  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('pmr_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>


  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, collection, doc, getDocs, addDoc, deleteDoc, setDoc, onSnapshot, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    let db = null;
    let firebaseReady = false;

    window._fb = {
      ready: () => firebaseReady && db !== null,
      db: () => db,
      collection, doc, getDocs, addDoc, deleteDoc, setDoc, onSnapshot, serverTimestamp
    };

    async function initFirebase() {
      // 1. Coba ambil config custom dari localStorage (jika diinput manual via modal)
      let firebaseConfig = JSON.parse(localStorage.getItem('pmr_fb_config') || 'null');

      // 2. Jika tidak ada di localStorage, ambil dari endpoint serverless /api/config (Vercel Environment Variables)
      if (!firebaseConfig || !firebaseConfig.apiKey) {
        try {
          const res = await fetch('/api/config');
          if (res.ok) {
            const remoteConfig = await res.json();
            if (remoteConfig && remoteConfig.apiKey) {
              firebaseConfig = remoteConfig;
            }
          }
        } catch (err) {
          console.warn('Tidak dapat mengambil konfigurasi dari /api/config:', err.message);
        }
      }

      // 3. Inisialisasi Firebase jika config ditemukan
      if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId) {
        try {
          const app = initializeApp(firebaseConfig);
          db = getFirestore(app);
          firebaseReady = true;
          console.log('✅ Firebase terhubung!');
        } catch (e) {
          console.warn('⚠️ Firebase gagal diinisialisasi:', e.message);
        }
      } else {
        console.warn('⚠️ Konfigurasi Firebase belum diatur. Menggunakan database lokal.');
      }

      // Beritahu app.js bahwa Firebase siap dicek
      window.dispatchEvent(new Event('firebase-ready'));
    }

    initFirebase();
  </script>
</head>
<body>

  <div class="floaties" id="floaties"></div>

  <div id="login-screen"></div>

  <div id="app" style="display:none">

    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">
          <i class="ti ti-shield-heart"></i>
        </div>
        <div class="sidebar-logo-text">
          <div class="sidebar-logo-title">MY UKS</div>
          <div class="sidebar-logo-sub">Markas Digital PMR</div>
        </div>
      </div>

      <div class="sidebar-nav">
        <button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')">
          <i class="ti ti-home"></i> Beranda
        </button>
        <button class="nav-btn" data-page="anggota" onclick="showPage('anggota')">
          <i class="ti ti-users"></i> Anggota
        </button>
        <button class="nav-btn" data-page="pasien" onclick="showPage('pasien')">
          <i class="ti ti-heart-pulse"></i> Data Pasien
        </button>
        <button class="nav-btn" data-page="stok" onclick="showPage('stok')">
          <i class="ti ti-medicine-syrup"></i> Stok UKS
        </button>
        <button class="nav-btn" data-page="absensi" onclick="showPage('absensi')">
          <i class="ti ti-clipboard-check"></i> Absensi
        </button>
        <button class="nav-btn" data-page="jadwal" onclick="showPage('jadwal')">
          <i class="ti ti-calendar-event"></i> Jadwal Jaga
        </button>
        <button class="nav-btn" data-page="laporan" onclick="showPage('laporan')">
          <i class="ti ti-report-analytics"></i> Laporan
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-user-card">
          <div class="sidebar-user-top">
            <div class="sidebar-avatar"><i class="ti ti-user"></i></div>
            <div class="sidebar-user-details">
              <div class="sidebar-username" id="sb-user-name">Admin PMR</div>
              <div class="sidebar-userrole" id="sb-user-role">Ketua • NIS: -</div>
            </div>
          </div>
          <div class="sidebar-user-actions" id="sb-actions-wrap">
            <button class="sidebar-icon-btn theme-toggle-btn" onclick="toggleTheme()" title="Ganti Mode Gelap / Terang"><i class="ti ti-moon theme-icon"></i></button>
            <button class="sidebar-icon-btn" onclick="openChangePasswordModal()" title="Ubah Password"><i class="ti ti-key"></i></button>
            <button class="sidebar-icon-btn logout" onclick="logout()" title="Keluar"><i class="ti ti-logout"></i></button>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px">
            <span id="sb-fb-badge" class="fb-status disconnected" onclick="openFbModal()" title="Status Sinkronisasi">
              <span class="fb-dot amber"></span>Firebase Cloud
            </span>
            <span id="sb-clock" class="sidebar-clock"></span>
          </div>
        </div>
      </div>
    </aside>

    <div id="main-wrapper">
      <header id="mobile-header">
        <div class="logo">
          <span class="logo-badge">PMR</span>
          <span class="logo-heart">🏥</span>
          <span>MY UKS</span>
        </div>

        <div class="header-right">
          <div id="header-user-info"></div>
          <button class="btn btn-ghost btn-sm theme-header-toggle" onclick="toggleTheme()" title="Ganti Mode Gelap / Terang">
            <i class="ti ti-moon theme-icon"></i>
          </button>
          <span class="hbadge"><span class="dot"></span> Online</span>
          <span id="fb-status-badge" class="fb-status disconnected" onclick="openFbModal()" title="Konfigurasi Firebase">
            <span class="fb-dot amber"></span>Firebase
          </span>
          <span id="clock-display"></span>
        </div>
      </header>

      <nav id="mobile-nav">
        <button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')">
          <i class="ti ti-home"></i> Beranda
        </button>
        <button class="nav-btn" data-page="anggota" onclick="showPage('anggota')">
          <i class="ti ti-users"></i> Anggota
        </button>
        <button class="nav-btn" data-page="pasien" onclick="showPage('pasien')">
          <i class="ti ti-heart-pulse"></i> Data Pasien
        </button>
        <button class="nav-btn" data-page="stok" onclick="showPage('stok')">
          <i class="ti ti-medicine-syrup"></i> Stok UKS
        </button>
        <button class="nav-btn" data-page="absensi" onclick="showPage('absensi')">
          <i class="ti ti-clipboard-check"></i> Absensi
        </button>
        <button class="nav-btn" data-page="jadwal" onclick="showPage('jadwal')">
          <i class="ti ti-calendar-event"></i> Jadwal Jaga
        </button>
        <button class="nav-btn" data-page="laporan" onclick="showPage('laporan')">
          <i class="ti ti-report-analytics"></i> Laporan
        </button>
      </nav>

      <main id="main-content"></main>
    </div>

  </div>

  <div id="toast"><i class="ti ti-check"></i><span id="toast-msg"></span></div>

  <script src="app.js"></script>
</body>
</html>
